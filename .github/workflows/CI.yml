name: CI

# The package's suite (test/runtests.jl, ReTestItems). The suite runs on the KernelAbstractions CPU backend; the CUDA gate
# (test/gate_marg_mix_ka.jl --cuda) is a manual script, not part of the suite.
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
        os:
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      # CauRegistry as well as General until the stack is in General.
      - uses: julia-actions/julia-buildpkg@v1
        with:
          localregistry: https://github.com/prittjam/CauRegistry.jl.git
      - uses: julia-actions/julia-runtest@v1
