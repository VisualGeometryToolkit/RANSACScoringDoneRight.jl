# =============================================================================
# cvpr2027 — the CVPR 2027 research project of RANSACScoringDoneRight
# ("RANSAC Scoring Done Extremely Right"): drivers (scripts/), configs of record
# (configs/), data bindings (data/), the paper (paper/) and its asset index
# (REPRODUCE.md). A DrWatson project (VisualGeometryToolkitEval PaperProjects
# conventions, new_paper_project), not a package; the sibling of neurips2026.
# A member of the repository's workspace (../Project.toml): it resolves with the
# package, its tests, its docs and neurips2026 in the one root Manifest.
#
#   julia --project=. scripts/<driver>.jl --plan
#   julia --project=. test/runtests.jl          # the project's tests
# =============================================================================
name = "CVPR2027"
authors = ["James Pritts"]

[deps]
Distributions = "31c24e10-a181-5473-b8eb-7969acd0382f"
DrWatson = "634d3b9d-ee7a-5ddf-bec9-22491ea816e1"
JLD2 = "033835bb-8acc-5ee8-8aae-3f567f8a3819"
LogExpFunctions = "2ab3a3ac-af41-5b50-aa03-7779005ae688"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
RANSACScoringDoneRight = "084d9f33-8b05-4903-a655-8a8c4926d033"
StableRNGs = "860ef19b-820b-49d6-a774-d7a799459cd3"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
TOML = "fa267f1f-6049-4f14-aa54-33bafae1ed76"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"
VisualGeometryToolkitCore = "96820d6b-1dad-4e77-ad4a-8276f2ec1ce7"
VisualGeometryToolkitEval = "86c88899-11c8-4b8e-8d7a-f01a8ab99b28"

[sources]
RANSACScoringDoneRight = {path = ".."}

[compat]
