# =============================================================================
# eth_f_pools — the ETH3D FUNDAMENTAL-matrix scoring pools the paper's ETH3D
# cells were evaluated on (SuperPoint+LightGlue correspondences, 1 000
# accepted minimal samples per pair, 13 scenes, 3 039 pairs), as a config of
# record.
#
# PRODUCER NOT PORTED. Generated by RobustVisualGeometry
# eval/generate_roma_scoring_data.jl --problem=fundmat into [experiment]
# pool_dir (since rewritten; REPRODUCE.md, "Not ported"). Load-bearing today:
# [source], from which configs/data_artifacts.toml derives the file list of
# the published `eth3d_splg_csponds` artifact (shared with accv2026).
# =============================================================================

[experiment]
dataset = "eth3d"
matcher = "splg"
problem = "F"
pool_dir = "datasets/eth3d/derived/splg/scoring_data_F"   # RELATIVE to data_root()

[source]
route = "roma"
splits = ["eth3d:validation", "eth3d:test"]
image_unit = "px"
input_jld2_dir = "datasets/eth3d/derived/splg/csponds"

[pool]
sampler = "gaussian"
gaussian_sigma = 0.125
target = 1000
max_attempts = 100000
snn_threshold = 0.7
min_csponds = 20
max_pairs_per_scene = 2200
subsample_seed = 42
