# =============================================================================
# neurips2026 — the NeurIPS 2026 research project of RANSACScoringDoneRight
# ("RANSAC Scoring Done Right"): drivers (scripts/), configs of record
# (configs/), data bindings (data/), the paper (paper/) and its asset index
# (REPRODUCE.md). A DrWatson project (VisualGeometryToolkitEval PaperProjects
# conventions), not a package: it devs the repository's package by relative
# path and carries every dependency the drivers need; the package's own
# Project.toml stays a library and never depends on this project. A member of
# the repository's workspace (../Project.toml): the package, its tests, its docs
# and this project resolve together, in the one untracked root Manifest.
#
# RANSACScoringDoneRight has no pool IO (pools are read with
# VisualGeometryToolkitEval.Pools) and no concrete problem types (they are
# VisualGeometryToolkitEstimation's); the studies here need both, so they live in this
# environment rather than widening the package's [deps].
#
#   cd neurips2026 && julia --project=. -e 'using Pkg; Pkg.instantiate()'
#   julia --project=. scripts/<driver>.jl --plan
#   julia --project=. test/runtests.jl          # the project's tests
# =============================================================================
